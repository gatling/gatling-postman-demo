version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/javascript"
      - "/typescript"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
      day: "monday" # explicit, even tough it's the weekly default
      time: "07:00" # UTC
    groups:
      gatling:
        patterns:
          - "@gatling.io/*"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
    schedule:
      interval: "weekly"
      day: "monday" # explicit, even though it's the weekly default
      time: "07:00" # UTC
    cooldown:
      default-days: 7
